name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Migration round-trip on a fresh database
        working-directory: backend
        env:
          SCOUTMIND_DATABASE_URL: sqlite:///./ci-fresh.db
        run: |
          .\.venv\Scripts\python.exe -m alembic upgrade head
          .\.venv\Scripts\python.exe -m alembic downgrade -1
          .\.venv\Scripts\python.exe -m alembic upgrade head
      - name: Test suite
        working-directory: backend
        run: .\.venv\Scripts\python.exe -m pytest -q

  security:
    name: Upload / identity / agent isolation regressions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Security regressions
        working-directory: backend
        run: >
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_p1_security.py
          tests/test_sm_phase1.py
          tests/test_sm004_compatibility.py
          tests/test_sm005_transfer_perf.py
          tests/test_sm007_sm009_agent.py

  dotnet:
    name: .NET readers and agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build solution
        run: dotnet build ScoutMind.sln -c Release
      - name: Reader unit + harness tests
        working-directory: live-reader/tests/ScoutMind.FMReader.Tests
        run: dotnet run -c Release
      - name: Reader integration tests
        working-directory: live-reader/tests/ScoutMind.Reader.Tests
        run: dotnet run -c Release
      - name: Compatibility manifest consistency
        run: dotnet run --project live-reader/tools/ScoutMind.FMReader.Diag/ScoutMind.FMReader.Diag.csproj -c Release -- configcheck

  frontend:
    name: Frontend (typecheck + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  postgres-migrations:
    name: PostgreSQL migration compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoutmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoutmind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies and PostgreSQL driver
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "psycopg[binary]>=3.2,<4"
      - name: Upgrade empty PostgreSQL database to head
        working-directory: backend
        env:
          SCOUTMIND_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scoutmind_test
        run: |
          python -m alembic upgrade head
          python -m alembic current
