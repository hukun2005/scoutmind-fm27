services:
  postgres:
    image: postgres:16-alpine
    container_name: scoutmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoutmind
      POSTGRES_PASSWORD: scoutmind
      POSTGRES_DB: scoutmind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scoutmind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutmind -d scoutmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: scoutmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCOUTMIND_DATABASE_URL: postgresql+psycopg://scoutmind:scoutmind@postgres:5432/scoutmind
      SCOUTMIND_HOST: 0.0.0.0
      SCOUTMIND_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - scoutmind-data:/app/data

volumes:
  scoutmind-pgdata:
  scoutmind-data:
